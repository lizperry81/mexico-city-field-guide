name: Validate research persistence
on:
  push:
    branches: [research-persistence]
    paths: ['research/batches/**', 'research/canonical/**', 'research/pipeline/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-merge-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-persistence
      - name: Validate canonical baseline (fail closed)
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sqlite3,sys
          root=pathlib.Path('research/canonical')
          db=root/'CDMX_CANONICAL.sqlite'; manifest=root/'manifest.json'
          if not db.is_file() or not manifest.is_file():
              sys.exit('BLOCKED: canonical SQLite and manifest not yet uploaded to research-persistence. No merge attempted.')
          m=json.loads(manifest.read_text()); expected=m['database']['sha256']
          if hashlib.sha256(db.read_bytes()).hexdigest()!=expected:
              sys.exit('BLOCKED: checksum mismatch')
          c=sqlite3.connect(db)
          if c.execute('PRAGMA integrity_check').fetchone()[0]!='ok' or c.execute('PRAGMA foreign_key_check').fetchall():
              sys.exit('BLOCKED: SQLite integrity failure')
          print('Baseline integrity and checksum verified. Batch merge remains gated pending importer deployment.')
          PY
