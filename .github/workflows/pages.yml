name: Deploy Mexico City Field Guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Validate pinned research handoff commit against branch history.
      - uses: actions/configure-pages@v5
      - name: Verify protected Discover baseline before publication
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/check_discover_editorial_baseline.py
          if [ "$EVENT_NAME" = "push" ]; then
            python scripts/check_discover_editorial_baseline.py --base-ref "$BASE_SHA"
          fi
      - name: Extract app
        run: |
          mkdir site extracted
          unzip cdmx-fieldguide-redesign.zip -d extracted
          cp -a extracted/cdmx-fieldguide-build/. site/
          # Use recovered rich homepage as baseline.
          cp recovered/mexico-city-field-guide.html site/index.html
          # Restore source-accurate V81 JSON (8 chapters, 21 claims, 12 sources).
          python scripts/recover_templo.py site
          python scripts/build_poi.py
          python scripts/test_poi.py
          python scripts/build_centro_pois.py
          python scripts/test_centro_pois.py
          if [ -f site/poi/templo-mayor/index.html ]; then
            python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          link='<a href="poi/templo-mayor/" style="display:block;background:#0d746e;color:white;padding:16px;border-radius:12px;text-align:center;font-weight:700;margin:16px auto;max-width:700px;text-decoration:none">Templo Mayor history and guided walk →</a>'
          s=s.replace('</body>',link+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          fi
          # Additive learning walk generated from preserved Centro source, after POI checks.
          python scripts/build_centro_walk.py
          python scripts/test_centro_walk.py
          # Enable comments after generators have finished; preserve all original historical content.
          mkdir -p site/feedback
          cp feedback/annotate.js site/feedback/annotate.js
          python scripts/enable_reader_feedback.py
          python scripts/test_reader_feedback.py
          # Stage only editor-approved Discover narratives; drafts stay unpublished.
          python scripts/build_discover_editorial.py
          python scripts/test_discover_editorial.py
          # Publish the revised reader at both POI URLs and retain the research dossier.
          python scripts/build_templo_review.py
          python scripts/test_templo_review.py
          node scripts/test_reader_navigation.js site/poi/templo-mayor/assets/reader.js
          # Generate the other three reader layouts from complete preserved dossiers.
          python scripts/build_centro_reviews.py
          python scripts/test_centro_reviews.py
          # Contextual links use the actual archived chapters and the existing walk threads.
          python scripts/build_thread_connections.py
          python scripts/test_thread_connections.py
          mkdir -p site/preview/teotihuacan
          cp preview/teotihuacan/index.html site/preview/teotihuacan/index.html
          mkdir -p site/preview/atlas
          cp preview/atlas/index.html site/preview/atlas/index.html
          # Incorporate the canonical research database from the separate research branch.
          git fetch origin research-persistence:refs/remotes/origin/research-persistence
          # Research-to-app handoff is read-only and never publishes staged findings.
          # An invalid handoff must be reported without disrupting a preserved app release.
          if ! python scripts/check_research_handoff.py; then
            echo '::warning::No verified research handoff; see private Actions artifact'
          fi
          python scripts/test_research_handoff.py
          git show origin/research-persistence:research/canonical/CDMX_CANONICAL.sqlite > /tmp/cdmx-canonical.sqlite
          git show origin/research-persistence:research/canonical/manifest.json > /tmp/cdmx-manifest.json
          python - <<'PY'
          import sqlite3,hashlib,json,pathlib,sys
          db=pathlib.Path('/tmp/cdmx-canonical.sqlite')
          m=json.loads(pathlib.Path('/tmp/cdmx-manifest.json').read_text())
          assert hashlib.sha256(db.read_bytes()).hexdigest()==m['database']['sha256'], 'Research database checksum mismatch'
          c=sqlite3.connect(str(db))
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not c.execute('PRAGMA foreign_key_check').fetchall()
          c.row_factory=sqlite3.Row
          rows=[dict(x) for x in c.execute('SELECT * FROM canonical_findings ORDER BY id')]
          assert len(rows)>=68, 'Unexpected loss of historical findings'
          out=pathlib.Path('site/data/canonical-findings-v97.json');out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'version':m['database']['version'],'count':len(rows),'findings':rows},ensure_ascii=False),encoding='utf-8')
          print('Exported',len(rows),'real historical findings from GitHub SQLite')
          PY
          mkdir -p site/research-library
          cp research-library/index.html site/research-library/index.html
          mkdir -p site/templo-mayor
          cp templo-mayor/index.html site/templo-mayor/index.html
          # Publication identity: confirm Pages serves THIS commit, not a cached older release.
          python - <<'PY'
          import datetime,hashlib,json,os,pathlib
          source=pathlib.Path('site/data/research')
          originals=('templo_walk_v63.json','templo_mayor_pilot.json','templo_verified_discoveries_v68.json')
          identity={
              'git_sha':os.environ['GITHUB_SHA'],
              'built_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'research_sha256':{name:hashlib.sha256((source/name).read_bytes()).hexdigest() for name in originals},
              'historical_poi_slugs':['templo-mayor','zocalo','metropolitan-cathedral','national-palace'],
              'review_layout':'history-guided-walk-plan',
          }
          output=pathlib.Path('site/data/build-info.json')
          output.write_text(json.dumps(identity,indent=2),encoding='utf-8')
          print('Build identity:',identity['git_sha'],flush=True)
          PY
      - name: Preserve editorial handoff verification (NOT part of public site)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-research-handoff
          path: artifacts/editorial-handoff/
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed mobile POI entry
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,urllib.request,urllib.parse,time,json
          url=os.environ['PAGE_URL'].rstrip('/')+'/poi/templo-mayor/'
          required=('Templo Mayor','Read before visiting','Follow on site','Plaza Manuel Gamio',
                    'Tlaltecuhtli','Coyolxauhqui','archive/#evidence','../../feedback/annotate.js')
          error=None
          for attempt in range(10):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MexicoCityFieldGuide-deploy-smoke/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      page=response.read().decode('utf-8')
                      assert response.status==200
                  missing=[x for x in required if x not in page]
                  assert not missing, f'Missing deployed content: {missing}'
                  assert len(page)>17000, f'Truncated deployed page: {len(page)} bytes'
                  print('LIVE POI VERIFIED:',url,'HTML chars:',len(page),flush=True)
                  break
              except Exception as ex:
                  error=ex
                  print(f'Live verification attempt {attempt+1} failed: {ex}',flush=True)
                  time.sleep(8)
          else:
              raise SystemExit(f'Live site NOT verified: {url}, final error: {error}')
          # Prevent false-positive live checks against a previous cached deployment.
          release_target=os.environ['PAGE_URL'].rstrip('/')+'/data/build-info.json'
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(release_target,timeout=25) as response:
                      live_release=json.load(response)
                      assert response.status==200
                  assert live_release['git_sha']==os.environ['GITHUB_SHA'], (
                      'Stale published commit',live_release['git_sha'],os.environ['GITHUB_SHA'])
                  assert len(live_release['research_sha256'])==3
                  print('EXACT COMMIT SERVED LIVE:',live_release['git_sha'],flush=True)
                  break
              except Exception as ex:
                  if attempt==9:raise
                  print('Waiting for release identity to update:',str(ex),flush=True)
                  time.sleep(8)
          # Cross-check the other historic-center POIs, recovered source JSON and homepage.
          root=os.environ['PAGE_URL'].rstrip('/')+'/'
          for path, markers in {
              '': ('Templo Mayor','</body>'),
              'poi/zocalo/': ('What to look for on site','The day the poor burned the palace','../../feedback/annotate.js'),
              'poi/metropolitan-cathedral/': ('What to look for on site','The floor isn','../../feedback/annotate.js'),
              'poi/national-palace/': ('What to look for on site','Rivera','../../feedback/annotate.js'),
              'poi/templo-mayor/archive/': ('History behind the excavated site','id="claimlist"','../../../feedback/annotate.js'),
              'poi/templo-mayor/assets/reader.js': ("window.addEventListener('hashchange', navigateHash)",'stop-progress'),
              'poi/templo-mayor/assets/reader.css': ('.photo-marker','.reader-nav'),
              'poi/zocalo/review/': ('id="centro-review-script"','id="centro-review-styles"','src="../../../feedback/annotate.js"','What to look for on site','The day the poor burned the palace','data-historical-thread'),
              'poi/metropolitan-cathedral/review/': ('id="centro-review-script"','id="centro-review-styles"','src="../../../feedback/annotate.js"','What to look for on site','The floor isn','data-historical-thread'),
              'poi/national-palace/review/': ('id="centro-review-script"','id="centro-review-styles"','src="../../../feedback/annotate.js"','What to look for on site','Rivera','data-historical-thread'),
              'walks/historic-center/': ('From Tenochtitlan to Mexico City','data-mode="outdoor"','data-choose-thread="conquest"','stop-national-palace','../../feedback/annotate.js'),
              'data/historic-center-walk.json': ('"historic-center-walk-1"','"original_source_ids"'),
              'data/historic-center-connections.json': ('"historic-center-chapter-comparisons-1"','"related_readings"'),
              'feedback/annotate.js': ('function allNotes()', 'Comment on this passage', 'feedback-open'),
              'data/research/templo_walk_v63.json': ('"chapters"','field_instruction'),
              'data/research/templo_mayor_pilot.json': ('"claims"','source_ids'),
              'data/research/templo_verified_discoveries_v68.json': ('"title"','"id"'),
          }.items():
              target=root+path
              with urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'CDMX-field-guide-deploy-check/1.0'}),timeout=25) as response:
                  body=response.read().decode('utf-8')
                  assert response.status==200, f'HTTP {response.status}: {target}'
              assert all(t in body for t in markers), f'Incomplete content at {target}'
              print('LIVE ROUTE VERIFIED:',target,'chars:',len(body),flush=True)
          # Verify the revised commentable Templo Mayor phone page.
          # This is a network smoke check, not a real touchscreen Safari test.
          review_target=root+'poi/templo-mayor/review/'
          review_error=None
          for attempt in range(8):
              try:
                  req=urllib.request.Request(review_target,headers={
                      'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      html=response.read().decode('utf-8')
                      assert response.status==200
                  required=['src="../assets/reader.js"','src="../../../feedback/annotate.js"',
                            'Read before visiting','Follow on site','Plaza Manuel Gamio',
                            'How can archaeologists date a wall?','Offering 125',
                            'Coyolxauhqui replica','The original Coyolxauhqui stone','id="next-stop"']
                  assert all(x in html for x in required), 'Review missing the revised history or walk'
                  assert 'data-historical-thread' not in html, 'Paused cross-links reappeared'
                  print('LIVE COMMENTABLE REVIEW VERIFIED:',review_target,len(html),flush=True)
                  break
              except Exception as ex:
                  review_error=ex
                  print('Review verification attempt',attempt+1,'failed:',ex,flush=True)
                  time.sleep(8)
          else:
              raise SystemExit(f'Published commentable review NOT verified: {review_error}')
          # All four commentable POIs must return the new linked chapters to an iPhone user agent.
          iphone_agent='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1'
          for slug in ('zocalo','metropolitan-cathedral','national-palace'):
              phone_url=root+'poi/'+slug+'/review/'
              with urllib.request.urlopen(urllib.request.Request(phone_url,headers={
                  'User-Agent':iphone_agent}),timeout=25) as response:
                  phone_body=response.read().decode('utf-8')
                  assert response.status==200
              for marker in ('name="viewport"','width=device-width',
                             'id="centro-review-script"','id="historical-connections-styles"',
                             'data-historical-thread','src="../../../feedback/annotate.js"'):
                  assert marker in phone_body, f'{slug}: mobile route missing {marker}'
              assert len(phone_body)>14000, f'{slug}: truncated mobile guide'
              print('IPHONE UA COMMENTABLE POI VERIFIED:',phone_url,len(phone_body),flush=True)
          # Validate the active contextual chapter links against the published mobile HTML,
          # not just generated source files. This detects stale Pages builds and broken paths.
          with urllib.request.urlopen(root+'data/historic-center-connections.json',timeout=25) as response:
              connections=json.load(response)
              assert response.status==200
          assert connections['count']==len(connections['comparisons'])==9
          phone_pages={}
          for slug in ('templo-mayor','zocalo','metropolitan-cathedral','national-palace'):
              url=root+'poi/'+slug+'/review/'
              req=urllib.request.Request(url,headers={'User-Agent':iphone_agent})
              with urllib.request.urlopen(req,timeout=25) as response:
                  phone_pages[slug]=response.read().decode('utf-8')
                  assert response.status==200
              if slug != 'templo-mayor':
                  assert 'window.addEventListener(\'hashchange\',navigateHash)' in phone_pages[slug], slug
          assert 'id="choose-stop"' in phone_pages['templo-mayor']
          checked=0
          for comparison in connections['comparisons']:
              origin=comparison['slug']
              source=phone_pages[origin]
              assert 'id="'+comparison['anchor']+'"' in source, comparison
              for related in comparison['related_readings']:
                  href=related['url']
                  assert 'href="'+href+'"' in source, (origin,href)
                  resolved=urllib.parse.urljoin(root+'poi/'+origin+'/review/',href)
                  target=urllib.parse.urlsplit(resolved)
                  expected=root+'poi/'+related['slug']+'/review/'
                  assert resolved.startswith(expected+'#'), resolved
                  assert 'id="'+target.fragment+'"' in phone_pages[related['slug']], resolved
                  checked+=1
          assert checked==2*connections['count'], checked
          print('LIVE CROSS-CHAPTER LINKS VERIFIED:',checked,'links across 4 published iPhone HTML pages',flush=True)
          # Mobile-User-Agent HTTP check (not a substitute for Safari interaction testing).
          mobile_target=root+'walks/historic-center/'
          mobile_req=urllib.request.Request(mobile_target,headers={
              'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1'
          })
          with urllib.request.urlopen(mobile_req,timeout=25) as response:
              mobile_html=response.read().decode('utf-8')
              assert response.status==200
          assert 'name="viewport"' in mobile_html
          assert 'width=device-width' in mobile_html
          assert 'data-mode="focus"' in mobile_html
          assert 'data-choose-thread="water"' in mobile_html
          for marker in ('id="locate-nearest"','id="disable-location"','id="location-status"',
                         'id="nearest-link"','navigator.geolocation.getCurrentPosition'):
              assert marker in mobile_html, f'Missing optional location UI: {marker}'
          print('MOBILE UA ROUTE VERIFIED:',mobile_target,'chars:',len(mobile_html),flush=True)
          PY

