name: Deploy Mexico City Field Guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract app
        run: |
          mkdir site extracted
          unzip cdmx-fieldguide-redesign.zip -d extracted
          cp -a extracted/cdmx-fieldguide-build/. site/
          # Use recovered rich homepage as baseline.
          cp recovered/mexico-city-field-guide.html site/index.html
          mkdir -p site/poi/templo-mayor
          cp poi/templo-mayor/index.html site/poi/templo-mayor/index.html
          # Restore source-accurate V81 JSON (8 chapters, 21 claims, 12 sources).
          python scripts/recover_templo.py site
          python scripts/build_poi.py
          python scripts/test_poi.py
          python scripts/build_centro_pois.py
          python scripts/test_centro_pois.py
          if [ -f site/poi/templo-mayor/index.html ]; then
            python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          link='<a href="poi/templo-mayor/" style="display:block;background:#0d746e;color:white;padding:16px;border-radius:12px;text-align:center;font-weight:700;margin:16px auto;max-width:700px;text-decoration:none">Explore the full Templo Mayor point of interest →</a>'
          s=s.replace('</body>',link+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          fi
          # Additive learning walk generated from preserved Centro source, after POI checks.
          python scripts/build_centro_walk.py
          python scripts/test_centro_walk.py
          mkdir -p site/preview/teotihuacan
          cp preview/teotihuacan/index.html site/preview/teotihuacan/index.html
          mkdir -p site/preview/atlas
          cp preview/atlas/index.html site/preview/atlas/index.html
          # Incorporate the canonical research database from the separate research branch.
          git fetch origin research-persistence:refs/remotes/origin/research-persistence
          git show origin/research-persistence:research/canonical/CDMX_CANONICAL.sqlite > /tmp/cdmx-canonical.sqlite
          git show origin/research-persistence:research/canonical/manifest.json > /tmp/cdmx-manifest.json
          python - <<'PY'
          import sqlite3,hashlib,json,pathlib,sys
          db=pathlib.Path('/tmp/cdmx-canonical.sqlite')
          m=json.loads(pathlib.Path('/tmp/cdmx-manifest.json').read_text())
          assert hashlib.sha256(db.read_bytes()).hexdigest()==m['database']['sha256'], 'Research database checksum mismatch'
          c=sqlite3.connect(str(db))
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not c.execute('PRAGMA foreign_key_check').fetchall()
          c.row_factory=sqlite3.Row
          rows=[dict(x) for x in c.execute('SELECT * FROM canonical_findings ORDER BY id')]
          assert len(rows)>=68, 'Unexpected loss of historical findings'
          out=pathlib.Path('site/data/canonical-findings-v97.json');out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'version':m['database']['version'],'count':len(rows),'findings':rows},ensure_ascii=False),encoding='utf-8')
          print('Exported',len(rows),'real historical findings from GitHub SQLite')
          PY
          mkdir -p site/research-library
          cp research-library/index.html site/research-library/index.html
          mkdir -p site/templo-mayor
          cp templo-mayor/index.html site/templo-mayor/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed mobile POI entry
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,urllib.request,time
          url=os.environ['PAGE_URL'].rstrip('/')+'/poi/templo-mayor/'
          required=('Templo Mayor','What to look for during the visit','History behind the excavated site','Tlaltecuhtli','Coyolxauhqui','id="museum"','id="claimlist"')
          error=None
          for attempt in range(10):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'MexicoCityFieldGuide-deploy-smoke/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      page=response.read().decode('utf-8')
                      assert response.status==200
                  missing=[x for x in required if x not in page]
                  assert not missing, f'Missing deployed content: {missing}'
                  assert len(page)>17000, f'Truncated deployed page: {len(page)} bytes'
                  print('LIVE POI VERIFIED:',url,'HTML chars:',len(page),flush=True)
                  break
              except Exception as ex:
                  error=ex
                  print(f'Live verification attempt {attempt+1} failed: {ex}',flush=True)
                  time.sleep(8)
          else:
              raise SystemExit(f'Live site NOT verified: {url}, final error: {error}')
          # Cross-check the other historic-center POIs, recovered source JSON and homepage.
          root=os.environ['PAGE_URL'].rstrip('/')+'/'
          for path, markers in {
              '': ('Templo Mayor','</body>'),
              'poi/zocalo/': ('What to look for on site','The day the poor burned the palace'),
              'poi/metropolitan-cathedral/': ('What to look for on site','The floor isn'),
              'poi/national-palace/': ('What to look for on site','Rivera'),
              'walks/historic-center/': ('From Tenochtitlan to Mexico City','data-mode="outdoor"','data-choose-thread="conquest"','stop-national-palace'),
              'data/historic-center-walk.json': ('"historic-center-walk-1"','"original_source_ids"'),
              'data/research/templo_walk_v63.json': ('"chapters"','field_instruction'),
              'data/research/templo_mayor_pilot.json': ('"claims"','source_ids'),
              'data/research/templo_verified_discoveries_v68.json': ('"title"','"id"'),
          }.items():
              target=root+path
              with urllib.request.urlopen(urllib.request.Request(target,headers={'User-Agent':'CDMX-field-guide-deploy-check/1.0'}),timeout=25) as response:
                  body=response.read().decode('utf-8')
                  assert response.status==200, f'HTTP {response.status}: {target}'
              assert all(t in body for t in markers), f'Incomplete content at {target}'
              print('LIVE ROUTE VERIFIED:',target,'chars:',len(body),flush=True)
          # Mobile-User-Agent HTTP check (not a substitute for Safari interaction testing).
          mobile_target=root+'walks/historic-center/'
          mobile_req=urllib.request.Request(mobile_target,headers={
              'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1'
          })
          with urllib.request.urlopen(mobile_req,timeout=25) as response:
              mobile_html=response.read().decode('utf-8')
              assert response.status==200
          assert 'name="viewport"' in mobile_html
          assert 'width=device-width' in mobile_html
          assert 'data-mode="focus"' in mobile_html
          assert 'data-choose-thread="water"' in mobile_html
          print('MOBILE UA ROUTE VERIFIED:',mobile_target,'chars:',len(mobile_html),flush=True)
          PY

