name: Discover editorial guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test editorial guard rejects unauthorized changes
        run: python -m unittest discover -s tests -p 'test_discover_editorial_guard.py' -v
      - name: Validate baseline archive integrity
        run: python scripts/check_discover_editorial_baseline.py
      - name: Require editorial review of protected changes on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_discover_editorial_baseline.py --base-ref "$BASE_SHA"
      - name: Reject unreviewed protected changes pushed directly to main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python scripts/check_discover_editorial_baseline.py --base-ref "$BASE_SHA"
